services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    ports:
      - "127.0.0.1:9870:9870"
      - "127.0.0.1:9000:9000"
    environment:
      CLUSTER_NAME: flowstate
    env_file:
      - ./infra/hadoop/hadoop.env
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./data/lake:/mnt/lake

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    env_file:
      - ./infra/hadoop/hadoop.env
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      - namenode

  # YARN daemons generate /etc/hadoop from infra/hadoop/hadoop.env.
  # Do not mount infra/hive/*.xml here (ADR-0014, ADR-0015).
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    hostname: resourcemanager
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    env_file:
      - ./infra/hadoop/hadoop.env
    depends_on:
      - namenode
      - datanode

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    hostname: nodemanager
    ports:
      - "127.0.0.1:8042:8042"
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./infra/hadoop/hadoop.env
    depends_on:
      - namenode
      - datanode
      - resourcemanager

  # CLUSTER_ID comes from infra/kafka/cluster.env (created by make up /
  # infra/kafka/ensure_cluster_id.py). Do not hardcode it here.
  kafka:
    image: apache/kafka:4.2.1
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: ${CLUSTER_ID:?Run 'make up' first (mints infra/kafka/cluster.env)}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

  spark:
    image: apache/spark:3.5.6
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    command:
      ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      PYTHONPATH: /opt/src
      FLOWSTATE_DATA_DIR: /opt/data
      FLOWSTATE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLOWSTATE_SPARK_MASTER: spark://spark:7077
      HADOOP_CONF_DIR: /etc/hadoop
    volumes:
      - ./data:/opt/data
      - ./src:/opt/src
      - ./infra/hive/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./infra/hive/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro
    depends_on:
      - kafka
      - namenode
      - datanode

  spark-worker:
    image: apache/spark:3.5.6
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark:7077",
      ]
    environment:
      PYTHONPATH: /opt/src
      FLOWSTATE_DATA_DIR: /opt/data
      FLOWSTATE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLOWSTATE_SPARK_MASTER: spark://spark:7077
      HADOOP_CONF_DIR: /etc/hadoop
    volumes:
      - ./data:/opt/data
      - ./src:/opt/src
      - ./infra/hive/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./infra/hive/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro
    depends_on:
      - spark
      - namenode
      - datanode

  hive-metastore:
    image: apache/hive:4.0.0
    # Image USER is hive, but /opt/hive/data is root-owned. Derby cannot
    # create metastore_db unless this process is root.
    user: "0:0"
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      HADOOP_CONF_DIR: /etc/hadoop
    volumes:
      - ./infra/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./infra/hive/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./infra/hive/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro
      - hive_metastore:/opt/hive/data
    depends_on:
      - namenode
      - datanode
    restart: on-failure

  hiveserver2:
    image: apache/hive:4.0.0
    # The image entrypoint always runs schematool unless IS_RESUME=true.
    # Schema init belongs to the metastore container only.
    # HiveServer2 requires /tmp/hive mode 0733. The image creates it as 0755.
    entrypoint:
      [
        "bash",
        "-c",
        "mkdir -p /tmp/hive /tmp/home && chmod 733 /tmp/hive && export HOME=/tmp/home && exec /entrypoint.sh",
      ]
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: -Dhive.metastore.uris=thrift://hive-metastore:9083
      HADOOP_CONF_DIR: /etc/hadoop
    volumes:
      - ./infra/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./infra/hive/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./infra/hive/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro
      - ./src:/opt/src:ro
    depends_on:
      - hive-metastore
      - namenode
      - datanode
    restart: on-failure

  runner:
    build: ./infra/runner
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      HADOOP_CONF_DIR: /etc/hadoop
      PYTHONPATH: /opt/src
    volumes:
      - ./data:/opt/data
      - ./src:/opt/src
      - ./infra/runner/server.py:/opt/runner/server.py:ro
      - ./infra/hive/core-site.xml:/etc/hadoop/core-site.xml:ro
      - ./infra/hive/hdfs-site.xml:/etc/hadoop/hdfs-site.xml:ro
      - ./infra/runner/yarn-site.xml:/etc/hadoop/yarn-site.xml:ro
      - ./infra/runner/mapred-site.xml:/etc/hadoop/mapred-site.xml:ro
    depends_on:
      - spark
      - namenode
      - hiveserver2

  postgres:
    image: postgres:16.10
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: flowstate
      POSTGRES_PASSWORD: flowstate
      POSTGRES_DB: flowstate
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  grafana:
    image: grafana/grafana:13.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboards/grafana:/var/lib/grafana/dashboards

volumes:
  namenode_data:
  datanode_data:
  kafka_data:
  hive_metastore:
  grafana_data:
  postgres_data:
