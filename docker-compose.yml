services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      CLUSTER_NAME: flowstate
    env_file:
      - ./infra/hadoop/hadoop.env
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./data/lake:/mnt/lake

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    env_file:
      - ./infra/hadoop/hadoop.env
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      - namenode

  kafka:
    image: bitnami/kafka:3.7.0
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka

  spark:
    image: bitnami/spark:3.5.1
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    environment:
      SPARK_MODE: master
      PYTHONPATH: /opt/src
      FLOWSTATE_DATA_DIR: /opt/data
      FLOWSTATE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLOWSTATE_SPARK_MASTER: spark://spark:7077
    volumes:
      - ./data:/opt/data
      - ./src:/opt/src

  spark-worker:
    image: bitnami/spark:3.5.1
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark:7077
      PYTHONPATH: /opt/src
      FLOWSTATE_DATA_DIR: /opt/data
      FLOWSTATE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLOWSTATE_SPARK_MASTER: spark://spark:7077
    volumes:
      - ./data:/opt/data
      - ./src:/opt/src
    depends_on:
      - spark

  hive-metastore:
    image: apache/hive:4.0.0
    ports:
      - "9083:9083"
    command: ["metastore"]
    environment:
      SERVICE_NAME: metastore
    volumes:
      - ./infra/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - hive_metastore:/opt/hive/data

  hiveserver2:
    image: apache/hive:4.0.0
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      HIVE_METASTORE_URIS: thrift://hive-metastore:9083
      SERVICE_NAME: hiveserver2
    volumes:
      - ./infra/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./src:/opt/src:ro
    depends_on:
      - hive-metastore

  superset:
    image: apache/superset:4.0.2
    ports:
      - "8088:8088"
    volumes:
      - ./dashboards/superset:/app/superset_home

volumes:
  namenode_data:
  datanode_data:
  kafka_data:
  hive_metastore:
