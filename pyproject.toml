[project]
name = "flowstate"
version = "0.1.0"
description = "Batch & real-time analytics on Indian urban mobility data"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==3.5.*",
    "kafka-python-ng==2.2.*",
    "pandas>=2.2",
    "pyarrow>=16",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "kagglehub>=0.2",
    "pydantic-settings>=2.4",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
viz = [
    "plotly>=5.22",
    "streamlit>=1.37",
    "h3>=4.0",
]

[tool.ruff]
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowstate"]
